<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="title">TETRIS</h1>
  <div class="toolbar">
    <label class="theme-toggle">
      <input type="checkbox" id="theme-toggle" role="switch" checked />
      <span>Modo oscuro</span>
    </label>
    <label class="mode-picker">
      <span>Modo</span>
      <select id="mode-select" aria-label="Modo de juego">
        <option value="">Clásico</option>
        <!-- Los retos se añaden desde game.js a partir de CHALLENGES (rules.js) -->
      </select>
    </label>
  </div>
  <div class="wrapper">
    <div class="game-container">
      <aside class="panel panel-left">
        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="80" height="80"></canvas>
        </div>

        <div class="panel-section energy" id="energy-section">
          <span class="label">ENERGÍA</span>
          <div class="energy-bar"><div class="energy-fill" id="energy-fill"></div></div>
          <span class="energy-label" id="energy-label">0%</span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd>/<kbd>Shift</kbd> reservar</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>M</kbd> sonido</li>
          </ul>
        </div>
      </aside>

      <canvas id="board" width="240" height="480"></canvas>

      <aside class="panel panel-right">
        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="80" height="80"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>

        <div class="stat-row">
          <div class="panel-section">
            <span class="label">LINES</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LEVEL</span>
            <span class="value" id="level">1</span>
          </div>
        </div>

        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">–</span>
        </div>

        <div class="panel-section" id="goal-section" hidden>
          <span class="label">OBJETIVO</span>
          <span class="goal" id="goal"></span>
          <span class="value" id="timer">0:00</span>
        </div>
      </aside>
    </div>

    <div id="ability-overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="ability-title">ELIGE UNA HABILIDAD</p>
        <div id="ability-list"></div>
        <p class="ability-hint"><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> elegir · <kbd>Esc</kbd> cancelar</p>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script>
    // Aplica el tema antes de pintar para evitar parpadeo
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="rules.js"></script>
  <script src="game.js"></script>
</body>
</html>
